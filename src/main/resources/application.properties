# Application name
spring.application.name=${SPRING_APPLICATION_NAME:gatewayservice}

# Server host domains
hosts=${HOSTS:main=localhost:8080}

# Server port - Set to 8443 for HTTPS traffic
server.port=${SERVER_PORT:8080}

# CORS origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:6080}

# HTTPS certificate settings
#server.ssl.enabled=${SERVER_SSL_ENABLED:true}
#server.ssl.key-store=${SERVER_SSL_KEY_STORE:file:/gatewayservice/certs/keystore.p12}
#server.ssl.key-store-password=${SERVER_SSL_KEY_STORE_PASSWORD:changeit}
#server.ssl.key-store-type=${SERVER_SSL_KEY_STORE_TYPE:PKCS12}

# Redis rate-limit config
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT}
spring.data.redis.timeout=${REDIS_TIMEOUT}
rate-limit.login.max-requests=${LOGIN_RATE_LIMIT_MAX_REQUESTS}
rate-limit.login.window-minutes=${LOGIN_RATE_LIMIT_WINDOW_MINUTES}
rate-limit.register.max-requests=${REGISTER_RATE_LIMIT_MAX_REQUESTS}
rate-limit.register.window-minutes=${REGISTER_RATE_LIMIT_WINDOW_MINUTES}
rate-limit.password-reset.max-requests=${PASSWORD_RESET_RATE_LIMIT_MAX_REQUESTS}
rate-limit.password-reset.window-minutes=${PASSWORD_RESET_RATE_LIMIT_WINDOW_MINUTES}
