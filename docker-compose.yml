services:
  gateway-service:
    build: .
    networks:
      - shared-network
      - gateway-redis-network
    ports:
      - "8080:8080"
    container_name: gateway-service
    labels:
      com.msinit.log: "true"
      com.msinit.service-name: "gatewayservice"
    environment:
      - SPRING_APPLICATION_NAME=${SPRING_APPLICATION_NAME}
      - SERVER_PORT=${SERVER_PORT}
      - JENKINS_SERVICE_URL=${JENKINS_SERVICE_URL} # Integration line: Jenkins
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL} # Integration line: Auth
      - EMAIL_SERVICE_URL=${EMAIL_SERVICE_URL} # Integration line: Email
      - FILE_SERVICE_URL=${FILE_SERVICE_URL} # Integration line: File
      - VAULT_SERVICE_URL=${VAULT_SERVICE_URL} # Integration line: Vault
      - TELEMETRY_SERVICE_URL=${TELEMETRY_SERVICE_URL} # Integration line: Telemetry
      - REACT_SERVICE_URL=${REACT_SERVICE_URL} # Integration line: React
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - HOSTS=${HOSTS}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_CONNECT_TIMEOUT=${REDIS_CONNECT_TIMEOUT}
      - REDIS_TIMEOUT=${REDIS_TIMEOUT}
      - LOGIN_RATE_LIMIT_MAX_REQUESTS=${LOGIN_RATE_LIMIT_MAX_REQUESTS}
      - LOGIN_RATE_LIMIT_WINDOW_MINUTES=${LOGIN_RATE_LIMIT_WINDOW_MINUTES}
      - REGISTER_RATE_LIMIT_MAX_REQUESTS=${REGISTER_RATE_LIMIT_MAX_REQUESTS}
      - REGISTER_RATE_LIMIT_WINDOW_MINUTES=${REGISTER_RATE_LIMIT_WINDOW_MINUTES}
      - PASSWORD_RESET_RATE_LIMIT_MAX_REQUESTS=${PASSWORD_RESET_RATE_LIMIT_MAX_REQUESTS}
      - PASSWORD_RESET_RATE_LIMIT_WINDOW_MINUTES=${PASSWORD_RESET_RATE_LIMIT_WINDOW_MINUTES}
#      - SERVER_SSL_ENABLED=${SERVER_SSL_ENABLED} # Uncomment for prod deployments
#      - SERVER_SSL_KEY_STORE=${SERVER_SSL_KEY_STORE} # Uncomment for prod deployments
#      - SERVER_SSL_KEY_STORE_PASSWORD=${SERVER_SSL_KEY_STORE_PASSWORD} # Uncomment for prod deployments
#      - SERVER_SSL_KEY_STORE_TYPE=${SERVER_SSL_KEY_STORE_TYPE} # Uncomment for prod deployments
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: [ "CMD-SHELL", "pgrep -f 'gatewayservice.jar' > /dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      gateway-redis:
        condition: service_started
  gateway-redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    container_name: gateway-redis
    restart: unless-stopped
    networks:
      - gateway-redis-network
    volumes:
      - gateway-redis-data:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG" ]
      interval: 10s
      timeout: 5s
      retries: 20
networks:
  shared-network:
    external: true
  gateway-redis-network:
    internal: true
volumes:
  gateway-redis-data:
